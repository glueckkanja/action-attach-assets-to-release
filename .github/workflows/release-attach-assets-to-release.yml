name: Release Attach Assets to Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create a Git tag and release"
        default: false
        type: boolean
      is_prerelease:
        description: "Create a prerelease version"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      commit_subject: ${{ steps.version.outputs.commit_subject }}
    steps:
      - name: Generate version for release
        id: version
        uses: glueckkanja/action-semantic-version@35b934d4dcec52abc5a3f49d9e60a51df9357730 # v4.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          suppress_tag: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.create_tag)) != true }}
          is_prerelease: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.is_prerelease) }}