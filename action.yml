name: Attach Assets to Release
description: >
  Attaches files (e.g. binaries, zip archives) to an existing GitHub release by release ID.

inputs:
  github_token:
    description: "GitHub token with write access to repository contents (releases)."
    required: true
  release_id:
    description: "ID of an existing release to attach files to."
    required: true
  asset_path:
    description: "Path to a single file or directory containing the files to attach to the release."
    required: true
  publish_draft_release:
    description: "If the release is a draft, publish it after the assets have been uploaded."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Attach assets to release
      id: attach-assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RELEASE_ID: ${{ inputs.release_id }}
        ASSET_PATH: ${{ inputs.asset_path }}
      run: |
        & "${{ github.action_path }}/scripts/attach-assets-to-release.ps1"

    - name: Publish draft release
      if: inputs.publish_draft_release == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RELEASE_ID: ${{ inputs.release_id }}
      run: |
        & "${{ github.action_path }}/scripts/publish-draft-release.ps1"
