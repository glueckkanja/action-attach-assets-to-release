name: Attach Artifacts to Release
description: >
  Attaches files (e.g. binaries, zip archives) to an existing GitHub release by release ID.

inputs:
  github-token:
    description: "GitHub token with write access to repository contents (releases)."
    required: true
  release-id:
    description: "ID of an existing release to attach files to."
    required: true
  file-path:
    description: "Path to a single file or directory containing the files to attach to the release."
    required: true

runs:
  using: composite
  steps:
    - name: Attach artifacts to release
      id: attach-artifacts
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_ID: ${{ inputs.release-id }}
        ARTIFACT_PATH: ${{ inputs.file-path }}
      run: |
        & "${{ github.action_path }}/scripts/attach-artifacts-to-release.ps1"
